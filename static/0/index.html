<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-size:20px;">
<script>
  document.write("dpr = " + window.devicePixelRatio + "<br>");
  document.write("screen.width = " + screen.width + "<br>");
  document.write("screen.height = " + screen.height + "<br>");
  document.write("innerWidth = " + window.innerWidth + "<br>");
  document.write("innerHeight = " + window.innerHeight);
</script>
</body>
</html>
