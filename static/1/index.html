<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>键盘</title>
<style>
  body {
    width:240px; height:240px;
    margin:0; padding:0;
    background:#111;
    font-family:Arial, sans-serif;
  }
  /* 顶部显示已输入的网址 */
  #display {
    width:224px; height:30px; line-height:30px;
    padding:0 8px;
    color:#fff; font-size:13px;
    overflow:hidden; white-space:nowrap;
    border-bottom:1px solid #333;
  }
  /* 键盘表格 */
  table {
    width:240px; height:204px;
    border-collapse:separate; border-spacing:3px;
    table-layout:fixed;
  }
  td { padding:0; }
  button {
    width:100%; height:100%;
    border:1px solid #444; border-radius:4px;
    background:#000; color:#fff;
    font-size:15px; font-weight:bold;
  }
  #toggleBtn { background:#1a5fb4; border-color:#1a5fb4; }
  #checkBtn  { background:#2ea043; border-color:#2ea043; }
</style>
</head>
<body>

<!-- 顶部显示已输入的网址 -->
<div id="display"></div>

<!-- 键盘 -->
<table>
  <tr>
    <td><button class="key" onclick="typeChar(this)">a</button></td>
    <td><button class="key" onclick="typeChar(this)">b</button></td>
    <td><button class="key" onclick="typeChar(this)">c</button></td>
  </tr>
  <tr>
    <td><button class="key" onclick="typeChar(this)">d</button></td>
    <td><button class="key" onclick="typeChar(this)">e</button></td>
    <td><button class="key" onclick="typeChar(this)">f</button></td>
  </tr>
  <tr>
    <td><button class="key" onclick="typeChar(this)">g</button></td>
    <td><button class="key" onclick="typeChar(this)">h</button></td>
    <td><button class="key" onclick="typeChar(this)">i</button></td>
  </tr>
  <tr>
    <td><button id="toggleBtn" onclick="toggleKeys()">切换</button></td>
    <td><button onclick="backspace()">⌫</button></td>
    <td><button id="checkBtn" onclick="goToUrl()">✓</button></td>
  </tr>
</table>

<script>
  // 三组按键：abcdefghi → jklmnopqr → stuvwxyz.
  var keySets = [
    ['a','b','c','d','e','f','g','h','i'],
    ['j','k','l','m','n','o','p','q','r'],
    ['s','t','u','v','w','x','y','z','.']
  ];
  var setIndex = 0;
  var letterKeys = document.querySelectorAll('button.key');

  function toggleKeys() {
    setIndex = (setIndex + 1) % keySets.length;
    for (var i = 0; i < letterKeys.length; i++) {
      letterKeys[i].innerHTML = keySets[setIndex][i];
    }
  }

  function typeChar(btn) {
    document.getElementById('display').innerHTML += btn.innerHTML;
  }

  function backspace() {
    var d = document.getElementById('display');
    d.innerHTML = d.innerHTML.slice(0, -1);
  }

  function goToUrl() {
    var url = document.getElementById('display').innerHTML.replace(/^\s+|\s+$/g, '');
    if (!url) return;                        // 没输入就不跳
    if (url.indexOf('http://') !== 0 && url.indexOf('https://') !== 0) {
      url = 'https://' + url;                // 自动补全协议
    }
    window.location.href = url;              // 跳转到输入的网址
  }
</script>

</body>
</html>
