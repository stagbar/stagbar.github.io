<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', -apple-system, system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }
        
        .logo {
            font-size: 2.8rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }
        
        .logo span {
            color: #3498db;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 3rem;
            line-height: 1.6;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .button-container {
            margin: 3rem 0;
        }
        
        .main-button {
            display: inline-block;
            background: linear-gradient(to right, #3498db, #2c3e50);
            color: white;
            font-size: 1.4rem;
            font-weight: 600;
            padding: 18px 50px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.3);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .main-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.4);
        }
        
        .main-button:active {
            transform: translateY(-1px);
        }
        
        .main-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #2c3e50, #3498db);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 50px;
        }
        
        .main-button:hover::after {
            opacity: 1;
        }
        
        .main-button span {
            position: relative;
            z-index: 2;
        }
        
        .footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #bdc3c7;
            font-size: 0.9rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .logo {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
                padding: 0 20px;
            }
            
            .main-button {
                font-size: 1.2rem;
                padding: 16px 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">文档<span>中心</span></h1>
        
        <p class="subtitle">
            欢迎来到文档中心，这里汇集了精选的技术文章、使用指南和相关资源。点击下方按钮即可查看所有文章。
        </p>
        
        <div class="button-container">
            <a href="https://stagbar.github.io/public/index.html" class="main-button">
                <span>文章</span>
            </a>
        </div>
    </div>
    
    <div class="footer">
        简洁引导页 | 文档中心 © 2026
    </div>
</body>
</html>
